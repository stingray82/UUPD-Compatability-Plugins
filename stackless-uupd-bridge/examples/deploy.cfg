# Place alongside deploy.sh, in a folder containing YOUR_SLUG/ (the plugin folder).
PLUGIN_NAME=Example Plugin
PLUGIN_SLUG=example-plugin
ZIP_NAME=example-plugin.zip
PLUGIN_TAGS=updates, plugins
CHANGELOG_FILE=changelog.txt
STATIC_FILE=static.txt
# github | local | woo | github+woo | local+woo
DEPLOY_TARGET=woo
GITHUB_REPO=youraccount/example-plugin
TOKEN_FILE=./github_token.txt
DEST_DIR=./dist
# Optional. Use the provided example scripts or your own existing scripts.
HEADER_SCRIPT=./myplugin_headers_rup_gpl3.0.php
GENERATOR_SCRIPT=./generate_index.php
# Store URL and Stackless SOFTWARE SLUG (not the Woo product permalink slug).
WOO_STORE_URL=https://your-store.example
WOO_SOFTWARE_SLUG=example-plugin
# Don't put credentials here. Export WOO_USER, WOO_APP_PASSWORD in your shell.
# For GitHub, export GITHUB_TOKEN or set TOKEN_FILE (chmod 600).
